sonar.projectKey=alexbettelli_SE2-Group7-Participium
sonar.organization=alexbettelli
sonar.host.url=https://sonarcloud.io

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=SE2-Group7-Participium
sonar.projectVersion=1.0

# Source encoding
sonar.sourceEncoding=UTF-8

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=server,client/src

# Test files location
sonar.tests=server/tests
sonar.test.inclusions=**/*.test.js,**/*.test.mjs,**/*.spec.js,**/*.spec.mjs

# Exclude build outputs, dependencies,telegramBot and test files from analysis
sonar.exclusions=\
  **/node_modules/**,\
  **/coverage/**,\
  **/dist/**,\
  **/build/**,\
  **/uploads/**,\
  **/telegramBot/**,\
  **/*.test.js,\
  **/*.test.mjs,\
  **/*.spec.js,\
  **/*.spec.mjs

# Test coverage configuration
sonar.javascript.lcov.reportPaths=server/coverage/lcov.info

# Coverage exclusions - files excluded from coverage calculation only
sonar.coverage.exclusions=\
  **/node_modules/**,\
  **/coverage/**,\
  **/tests/**,\
  **/test/**,\
  **/telegramBot/**,\
  server/data/db.mjs,\
  server/data/schema.sql,\
  server/server.mjs,\
  client/src/**,\
  **/*.test.js,\
  **/*.test.mjs
